<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>今日の猫チャレンジ</title>
  <meta name="description" content="毎日20匹の猫に会える、写真の神経衰弱。">

  <!-- Xなどにリンクを貼ったときのプレビュー（URLは https:// から始まる完全な形にする。相対パスだとXが読めない） -->
  <meta property="og:title" content="今日の猫チャレンジ">
  <meta property="og:description" content="毎日20匹の猫に会える、写真の神経衰弱。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kametakameyama-ops.github.io/cat-memory-game/">
  <meta property="og:image" content="https://kametakameyama-ops.github.io/cat-memory-game/images/og-image.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/main.js"></script>
</head>
<body>
  <div class="app">
    <!-- 上部: タイトルと進み具合 -->
    <header class="topbar">
      <div class="topbar__title">
        <h1 class="logo">今日の猫チャレンジ</h1>
        <p class="topbar__date"><span id="challenge-number">#-</span> <span id="challenge-date"></span></p>
      </div>
      <dl class="status">
        <div class="status__item">
          <dt>会えた猫</dt>
          <dd><span id="matched-count">0</span><small>/<span id="total-count">20</span></small></dd>
        </div>
        <div class="status__item">
          <dt>のこり</dt>
          <dd id="timer">--:--</dd>
        </div>
      </dl>
    </header>

    <!-- 盤面 -->
    <main class="board-area" id="board-area">
      <div class="board" id="board" aria-label="カード"></div>
      <p class="board-area__message" id="loading-message">今日の猫を呼んでいます…</p>
    </main>
  </div>

  <!-- はじめの画面: モード選択 -->
  <section class="sheet" id="start-sheet" hidden aria-labelledby="start-title">
    <div class="sheet__panel">
      <h2 class="sheet__title" id="start-title">今日の猫たちが待っています</h2>
      <p class="sheet__lead">同じ写真のカードを2枚そろえよう。<br>そろった猫はタップで大きく見られます。</p>
      <fieldset class="modes">
        <legend class="visually-hidden">モード</legend>
        <label class="mode">
          <input type="radio" name="mode" id="mode-beginner" value="beginner">
          <span class="mode__name">初心者モード</span>
          <span class="mode__time">10分</span>
        </label>
        <label class="mode">
          <input type="radio" name="mode" id="mode-normal" value="normal">
          <span class="mode__name">通常モード</span>
          <span class="mode__time">5分</span>
        </label>
      </fieldset>
      <button class="button button--primary" id="start-button" type="button">あそぶ</button>
      <p class="sheet__note">タイマーは1枚目をめくったときに動き出します。</p>
      <p class="credit">写真：<a href="https://thecatapi.com/" target="_blank" rel="noopener">The Cat API</a>。掲載をやめてほしい写真は<a href="https://github.com/kametakameyama-ops/cat-memory-game/issues" target="_blank" rel="noopener">こちら</a>へお知らせください。</p>
    </div>
  </section>

  <!-- おわりの画面 -->
  <section class="sheet" id="result-sheet" hidden aria-labelledby="result-title">
    <div class="sheet__panel">
      <h2 class="sheet__title" id="result-title"></h2>
      <p class="sheet__lead" id="result-lead"></p>
      <div class="sheet__actions">
        <button class="button button--primary" id="open-album-button" type="button">今日の猫アルバムを見る</button>
        <button class="button" id="replay-button" type="button">もう一度あそぶ</button>
      </div>
    </div>
  </section>

  <!-- 今日の猫アルバム -->
  <section class="sheet sheet--full" id="album-sheet" hidden aria-labelledby="album-title">
    <div class="album">
      <header class="album__header">
        <div>
          <h2 class="album__title" id="album-title">今日の猫アルバム</h2>
          <p class="album__lead">お気に入りの1匹をえらんでシェアできます</p>
        </div>
        <button class="button button--small" id="album-replay-button" type="button">もう一度あそぶ</button>
      </header>
      <ul class="album__grid" id="album-grid"></ul>
      <footer class="album__footer">
        <p class="credit">写真：<a href="https://thecatapi.com/" target="_blank" rel="noopener">The Cat API</a>。掲載をやめてほしい写真は<a href="https://github.com/kametakameyama-ops/cat-memory-game/issues" target="_blank" rel="noopener">こちら</a>へお知らせください。</p>
      </footer>
    </div>
  </section>

  <!-- 写真の拡大表示 -->
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="猫の写真">
    <div class="lightbox__panel">
      <img class="lightbox__image" id="lightbox-image" alt="">
      <p class="lightbox__caption" id="lightbox-caption"></p>
      <div class="lightbox__actions">
        <button class="button button--primary" id="lightbox-share-button" type="button">この子をシェア</button>
        <button class="button" id="lightbox-close-button" type="button">とじる</button>
      </div>
    </div>
  </div>

  <!-- シェア（PCなど、共有メニューが使えないとき） -->
  <div class="lightbox" id="share-panel" hidden role="dialog" aria-modal="true" aria-labelledby="share-title">
    <div class="lightbox__panel">
      <h2 class="share__title" id="share-title">この子をシェア</h2>
      <img class="share__preview" id="share-preview" alt="シェア用の画像">
      <ol class="share__steps" id="share-steps"></ol>
      <div class="lightbox__actions">
        <button class="button" id="share-link-button" type="button">リンクをコピー</button>
        <button class="button" id="share-copy-button" type="button">画像をコピー</button>
        <button class="button" id="share-save-button" type="button">画像を保存</button>
        <a class="button button--primary" id="share-post-link" href="#" target="_blank" rel="noopener">Xで投稿</a>
        <button class="button" id="share-close-button" type="button">とじる</button>
      </div>
    </div>
  </div>
</body>
</html>
